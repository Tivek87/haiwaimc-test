name: Release datapack

# Publiceert automatisch een release zodra er een nieuwe versie bovenaan
# docs/CHANGELOG.md staat. Bestaat de tag al, dan wordt er niets gedaan.
# Draait bij ELKE push: elke wijziging moet een nieuwe versie + release hebben.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genereer alle structuren (strand 1-8 chunks + eiland 36x36)
        run: |
          python -m pip install --quiet numpy
          python tools/generate.py
          python tools/island_generate.py

      - name: Controleer versienummer (max 99 per deel, gelijk aan changelog)
        run: python scripts/bump_version.py --check

      - name: Lees nieuwste changelog-entry
        id: cl
        run: |
          version=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' docs/CHANGELOG.md)
          if [ -z "$version" ]; then echo "Geen versie gevonden in docs/CHANGELOG.md"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk '/^## \[/{n++} n==1' docs/CHANGELOG.md | tail -n +2 > notes.md
          cat notes.md

      - name: Bestaat deze release al?
        id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.cl.outputs.version }}" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Geen nieuwe versie? Dan faalt deze push
        if: steps.tag.outputs.exists == 'true' && github.event_name == 'push'
        run: |
          echo "::error::Versie v${{ steps.cl.outputs.version }} is al gereleased. Elke wijziging moet een nieuwe versie hebben: python3 scripts/bump_version.py \"wat er veranderd is\""
          exit 1

      - name: Maak zip
        if: steps.tag.outputs.exists == 'false'
        run: cd hawaii_beach && zip -r "../hawaii_beach-v${{ steps.cl.outputs.version }}.zip" .

      - name: Publiceer release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.cl.outputs.version }}
        run: |
          gh release create "v$VERSION" "hawaii_beach-v$VERSION.zip" \
            --title "Hawaii Beach v$VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
